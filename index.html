<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>會學習的對話AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  body{font-family:'Noto Sans TC',sans-serif}
  .glass{backdrop-filter:blur(20px); background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1)}
  .bubble-user{background:linear-gradient(135deg,#8b5cf6,#3b82f6)}
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col">
<header class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <img src="icon-192.png" class="w-9 h-9 rounded-xl">
    <div>
      <h1 class="font-bold leading-none">會學習的對話AI</h1>
      <p class="text-[11px] text-white/60">100% 本地 · 離線可用 · PWA</p>
    </div>
  </div>
  <div id="pwaStatus" class="text-[11px] px-2.5 py-1 rounded-full bg-white/10">檢查中...</div>
</header>
<div class="flex-1 flex flex-col lg:flex-row max-w-6xl w-full mx-auto">
  <div class="flex-1 flex flex-col h-[calc(100vh-56px)]">
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="flex gap-2">
        <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm">🤖</div>
        <div class="glass rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-[14px] leading-relaxed">嗨，我是你的學習型AI，現在是白紙狀態。你可以教我：<br><br>「<b>記住：我叫Paul</b>」<br>「<b>記住：我喜歡拿鐵不加糖</b>」<br>「<b>不對，應該是...</b>」<br><br>我會記在你手機裡，完全不經過網路。</div>
      </div>
    </div>
    <div class="p-3 border-t border-white/10 glass">
      <div class="flex gap-2 mb-2 overflow-x-auto">
        <button onclick="quick('記住：我叫Paul')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">記住：我叫Paul</button>
        <button onclick="quick('記住：我喜歡拿鐵')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">記住：我喜歡拿鐵</button>
        <button onclick="quick('我有什麼喜好？')" class="shrink-0 text-xs px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20">我有什麼喜好？</button>
      </div>
      <div class="flex gap-2">
        <input id="input" placeholder="教它點什麼，或跟它聊聊..." class="flex-1 bg-white/10 rounded-full px-4 py-3 text-sm outline-none focus:bg-white/15" onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()" class="w-11 h-11 rounded-full bubble-user flex items-center justify-center font-bold">↑</button>
      </div>
    </div>
  </div>
  <div class="w-full lg:w-[340px] border-t lg:border-t-0 lg:border-l border-white/10 bg-black/20 p-4 space-y-4 overflow-y-auto">
    <div class="flex gap-2">
      <button onclick="switchTab('memory')" id="tab-memory" class="flex-1 py-2 rounded-full bg-white text-black text-sm font-medium">記憶庫</button>
      <button onclick="switchTab('persona')" id="tab-persona" class="flex-1 py-2 rounded-full bg-white/10 text-sm">性格</button>
      <button onclick="switchTab('install')" id="tab-install" class="flex-1 py-2 rounded-full bg-white/10 text-sm">安裝</button>
    </div>
    <div id="panel-memory">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-medium text-sm">🧠 它的記憶 (存在你手機)</h3>
        <span id="memCount" class="text-xs text-white/60">0 條</span>
      </div>
      <div id="memList" class="space-y-2"></div>
      <button onclick="clearMem()" class="w-full mt-3 py-2 rounded-full bg-red-500/20 text-red-300 text-xs">一鍵清除所有記憶</button>
    </div>
  </div>
</div>
<script>
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
const pwaStatus=document.getElementById('pwaStatus');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn?.classList.remove('hidden');pwaStatus.textContent='可安裝';});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>{pwaStatus.textContent='離線可用 ✓';});}
let memories=JSON.parse(localStorage.getItem('ai_memories')||'[]');
function quick(t){document.getElementById('input').value=t;send();}
function send(){const i=document.getElementById('input');const txt=i.value.trim();if(!txt)return;addMsg('user',txt);i.value='';setTimeout(()=>{addMsg('ai','收到：'+txt);},300);}
function addMsg(r,t){const c=document.getElementById('chat');const d=document.createElement('div');d.className='flex gap-2 '+(r==='user'?'justify-end':'');d.innerHTML=r==='user'?'<div class="bubble-user rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%] text-[14px]">'+t+'</div>':'<div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-sm">🤖</div><div class="glass rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-[14px]">'+t+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;}
</script>
</body>
</html>
